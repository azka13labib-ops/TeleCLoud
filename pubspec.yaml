name: terabox_telegram_cloud
description: "A personal cloud storage Flutter app using Firebase & Telegram MTProto for unlimited 2GB storage."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Suite
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Telegram MTProto / TDLib Client
  telegram_client: ^0.8.44

  # File Management & Local Caching
  file_picker: ^8.1.3
  path_provider: ^2.1.4
  sqflite: ^2.3.3+2
  path: ^1.9.0

  # UI, Fonts & Auth
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
