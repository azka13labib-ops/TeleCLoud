org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Fix: Kotlin incremental compiler crashes when project (D:\) and pub cache (C:\) are on different drives.
# This disables incremental Kotlin compilation to eliminate the "different roots" IllegalArgumentException.
kotlin.incremental=false

# Parallel & daemon builds for faster subsequent compiles
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.daemon=true
